name: App Store Upload

on:
  workflow_dispatch:
    inputs:
      submit_only:
        description: "Skip archive/upload and only select the existing build for review submission."
        required: false
        type: boolean
        default: false
      verify_store_assets:
        description: "Require four-locale metadata and 72 modern Asset Library screenshots to be synchronized and verified before upload."
        required: false
        type: boolean
        default: true
      clean_screenshot_duplicates:
        description: "Unsupported legacy option; true fails closed. Screenshot changes require the approved modern Asset Library uploader."
        required: false
        type: boolean
        default: false
      submit_for_review:
        description: "Submit the selected build for App Review after upload verification."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and Upload Build
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      APP_IDENTIFIER: com.kaede.htmlmarkdownpreviewer
      APP_STORE_CONNECT_APP_ID: "6785794966"
      APP_STORE_CONNECT_VERSION_STRING: "1.8"
      APP_STORE_CONNECT_BUILD_NUMBER: "13"
      APP_STORE_CONNECT_PREVIOUS_VERSION_STRING: "1.7"
      APP_STORE_CONNECT_PLATFORM: IOS
      FASTLANE_METADATA_PATH: ${{ github.workspace }}/fastlane/metadata
      APP_STORE_CONNECT_SCREENSHOTS_PATH: ${{ github.workspace }}/docs/app-store-screenshots
      APP_STORE_CONNECT_RELEASE_TYPE: AFTER_APPROVAL
      APP_STORE_CONNECT_CLEAN_SCREENSHOT_DUPLICATES: ${{ inputs.clean_screenshot_duplicates }}
      APP_STORE_CONNECT_SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
      APPLE_TEAM_ID: Y4FV6WUU4V
      # The hosted preview currently ships an earlier beta. Distribution uses
      # the same verified RC as the local Release route, or stops before archive.
      RELEASE_XCODE_BUILD: 27A9275
      ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify integrated release materials
        run: python3 scripts/audit-integrated-release-materials.py

      - name: Prepare build paths
        run: |
          set -euo pipefail
          echo "ARCHIVE_PATH=$RUNNER_TEMP/HTMLPreviewer.xcarchive" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/AppStoreUpload" >> "$GITHUB_ENV"

      - name: Require Xcode and iOS SDK 27.1
        if: ${{ github.event.inputs.submit_only != 'true' }}
        # Auto-discover installations rather than inherit the image's default Xcode.
        run: env -u DEVELOPER_DIR bash scripts/select-release-toolchain.sh --github-env

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          if [[ -z "$ASC_API_KEY_ID" || -z "$ASC_API_ISSUER_ID" || -z "$ASC_API_KEY_BASE64" ]]; then
            echo "Missing App Store Connect API key secrets." >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 -D -o "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "ASC_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Require approval of the previous version
        env:
          APP_STORE_CONNECT_CHECK_RELEASE_GATE_ONLY: "true"
        run: ruby .github/scripts/submit-app-store-review.rb

      - name: Verify pre-synchronized modern App Store assets
        env:
          APP_STORE_CONNECT_CHECK_STORE_ASSETS_ONLY: "true"
          VERIFY_STORE_ASSETS: ${{ inputs.verify_store_assets }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_STORE_ASSETS" != "true" ]]; then
            echo "The four-locale metadata and 72-image Asset Library gate cannot be skipped." >&2
            exit 2
          fi
          # GET-only. Does not require build 13, upload images, or alter published AppInfo.
          # Synchronize first with scripts/asset-library/upload_assets.py under its
          # approved plan SHA and exact app/version/locale/group execution scope.
          ruby .github/scripts/submit-app-store-review.rb

      - name: Resolve Swift packages
        if: ${{ github.event.inputs.submit_only != 'true' }}
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project HTMLMarkdownPreviewer.xcodeproj \
            -scheme HTMLMarkdownPreviewer \
            -derivedDataPath "$DERIVED_DATA_PATH"

      - name: Archive with automatic App Store signing
        if: ${{ github.event.inputs.submit_only != 'true' }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project HTMLMarkdownPreviewer.xcodeproj \
            -scheme HTMLMarkdownPreviewer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_ALLOWED=YES

      - name: Inspect archive metadata
        if: ${{ github.event.inputs.submit_only != 'true' }}
        run: |
          set -euo pipefail
          APP_INFO="$ARCHIVE_PATH/Products/Applications/HTMLMarkdownPreviewer.app/Info.plist"
          plutil -p "$APP_INFO" | grep -E 'BuildMachineOSBuild|CFBundleShortVersionString|CFBundleVersion|DTPlatformVersion|DTSDKName|DTXcode|DTXcodeBuild|MinimumOSVersion'
          archive_sdk="$(plutil -extract DTSDKName raw -o - "$APP_INFO")"
          if [[ ! "$archive_sdk" =~ ^iphoneos27\.1(\.[0-9]+)?$ ]]; then
            echo "Archive SDK $archive_sdk does not meet the iPhone Duo release requirement." >&2
            exit 1
          fi
          [[ "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_INFO")" == "$APP_STORE_CONNECT_VERSION_STRING" ]]
          [[ "$(plutil -extract CFBundleVersion raw -o - "$APP_INFO")" == "$APP_STORE_CONNECT_BUILD_NUMBER" ]]

      - name: Upload archive to App Store Connect
        if: ${{ github.event.inputs.submit_only != 'true' }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions-upload.plist"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>Y4FV6WUU4V</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Verify uploaded build and optionally submit for review
        run: ruby .github/scripts/submit-app-store-review.rb

      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-store-upload-logs
          path: |
            ${{ runner.temp }}/AppStoreUpload
            ${{ runner.temp }}/ExportOptions-upload.plist
