<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML 预览器 · iPhone Duo 商店素材草稿</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#071225;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{max-width:1320px;margin:auto;padding:52px 32px 32px}.intro{max-width:850px;margin-bottom:34px}.status{display:inline-block;padding:8px 13px;border:1px solid #6e9edf66;border-radius:999px;color:#b8d8ff;font-size:12px;letter-spacing:.08em}.intro h1{font-size:clamp(28px,4vw,42px);margin:20px 0 12px;letter-spacing:-.04em}.intro p{color:#a6bbd8;line-height:1.8;font-size:15px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    article{padding:40px 34px 32px;border:1px solid #78b5ff30;border-radius:24px;background:radial-gradient(ellipse at 90% 40%,#67e8f918,transparent 60%),linear-gradient(145deg,#07152e,#0e63e9);box-shadow:0 28px 72px #0003}.outer{background:radial-gradient(ellipse at 20% 55%,#42c8ff20,transparent 65%),linear-gradient(145deg,#0a1230,#2859d8)}.eyebrow{display:inline-block;padding:9px 13px;background:#ffffff13;border:1px solid #ffffff30;border-radius:999px;color:#e0f1ff;font-size:12px;font-weight:650;letter-spacing:.08em}h2{font-size:clamp(31px,3.4vw,47px);line-height:1.2;letter-spacing:-.045em;margin:24px 0 14px}.sub{font-size:16px;line-height:1.7;color:#d1e5ff;min-height:55px;margin:0 0 26px}figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:15px}.shot{display:block;width:100%;height:auto;max-width:500px;object-fit:contain;box-shadow:0 18px 42px #030b2b66;border:1px solid #ffffff40;background:#fff}.outer .shot{max-width:420px}figcaption{color:#cee3ffb3;font-size:12px;line-height:1.6;text-align:center}footer{margin-top:28px;padding:20px 0;border-top:1px solid #9abfea24;color:#99b5d8;font-size:12px;line-height:1.8}a{color:#b8d8ff;text-underline-offset:3px}
    @media(max-width:760px){main{padding:32px 18px}.cards{grid-template-columns:1fr}article{padding:30px 24px}.sub{min-height:0}.shot{max-width:460px}}
  </style>
</head>
<body>
<main>
  <header class="intro">
    <span class="status">商店素材布局草稿 · 未上传</span>
    <h1>同一份周报，两种阅读空间</h1>
    <p>为 iPhone Duo 准备的内屏与外屏素材。两张均引用实际 App 原图，保留完整画面和原生比例；本页供审阅布局，尚未导出最终商店 PNG。</p>
  </header>
  <section class="cards" aria-label="iPhone Duo 内外屏草稿">
    <article>
      <span class="eyebrow">HTML 与 ZIP 报告 · 内屏</span>
      <h2>展开，<br>读得更从容</h2>
      <p class="sub">文件库与周报同屏，<br>在更宽的阅读空间查看内容。</p>
      <figure>
        <img class="shot" src="sources/zh-Hans/duo-inner-html.png" alt="iPhone Duo 内屏上实际打开的合成周报与文件库">
        <figcaption>简中实际 App 原图 · 内屏<br>CSS 等比显示，原 PNG 像素保持不变</figcaption>
      </figure>
    </article>
    <article class="outer">
      <span class="eyebrow">随身阅读 · 外屏</span>
      <h2>合上，<br>也能继续读</h2>
      <p class="sub">紧凑屏幕呈现同一份周报，<br>阅读工具仍然随手可用。</p>
      <figure>
        <img class="shot" src="sources/zh-Hans/duo-outer-html.png" alt="iPhone Duo 外屏上实际打开的同一份合成周报与阅读工具">
        <figcaption>简中实际 App 原图 · 外屏<br>CSS 等比显示，原 PNG 像素保持不变</figcaption>
      </figure>
    </article>
  </section>
  <footer>这是同一 Duo 分组内两种内容方向的布局提案，不承诺商店随展开或合上自动切换截图。<br><a href="plan.md">截图策略与验证范围</a> · <a href="evidence.json">精简来源记录</a></footer>
</main>
</body>
</html>
