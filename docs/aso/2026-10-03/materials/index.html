<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Previewer · 下一版 ASO 物料</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f4f6fa;color:#17243a}main{max-width:1320px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0 0 12px}p{color:#526077;line-height:1.7}.controls{display:flex;gap:12px;margin:25px 0;flex-wrap:wrap}select{font:inherit;background:white;border:1px solid #dce3ef;border-radius:10px;padding:10px 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;padding:14px;border-radius:16px}.card img{width:100%;display:block;border-radius:8px}.card p{font-size:13px;margin:10px 0 0}a{color:#245ccc}details{background:white;border-radius:12px;padding:18px;margin-top:24px}pre{white-space:pre-wrap;font:14px -apple-system;line-height:1.7}footer{margin-top:24px;font-size:13px;color:#627087}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>HTML Previewer · 下一版 ASO 物料</h1><p>四语言商店文案与真实 App 截图。点击图片查看原尺寸。<br>本地交付包，尚未上传；随下一次小版本合入，版本号待正常发版流程确定。</p><div class="controls"><label>语言 <select id="locale"><option value="zh-Hans">简体中文</option><option value="en-US">English</option><option value="ja">日本語</option><option value="zh-Hant">繁體中文</option></select></label><label>设备 <select id="device"><option value="iphone">iPhone</option><option value="ipad">iPad</option></select></label><a href="README.md">发布交接说明</a></div><div id="grid" class="grid"></div><details open><summary>本语言商店文案</summary><pre id="metadata"></pre></details><footer>报告与开发笔记均为合成示例。JSON / YAML、导入结果来自实际 App。最终构建若改变界面，应重拍相应截图。</footer></main><script>const listing={"status": "local_materials_prepared_not_uploaded", "preparedDate": "2026-10-03", "target": "next small release, metadata and screenshots ship together; version selected by normal release process", "namePolicy": "Keep the existing product name.", "evidence": "2026-09-02 through 2026-10-01 UTC: 343 App Store Search impressions and 3 first-time downloads from Search. Individual keyword volume and rank are unverified.", "locales": {"en-US": {"name": "HTML Previewer", "subtitle": "Markdown, JSON & ZIP Viewer", "keywords": "yaml,md,reader,offline,pdf,source,code,mermaid,latex,config,file,report,readme,htm,local,math", "promotional_text": "Read HTML and ZIP reports, Markdown code and math, and JSON/YAML structures. Files are processed on device. Paid download. No ads or subscriptions.", "description": "Open received HTML and ZIP reports, read Markdown notes, and inspect JSON or YAML on iPhone and iPad. Files are processed on your device.\n\nRead the content, keep the formatting\n- View HTML layouts, graphics, and animations.\n- Read Markdown tables and highlighted code, with one-tap code copying.\n- Display Markdown math equations and Mermaid diagrams offline.\n- Browse HTML and Markdown pages inside ZIP reports with local CSS and image assets.\n- Search within HTML and Markdown, navigate headings, adjust reading appearance, and reopen at your saved reading position.\n\nInspect JSON and YAML\n- Expand nested objects and arrays, search fields and values, and check highlighted source with line numbers.\n- Copy values or field paths and jump to the corresponding source line.\n- View and copy large JSON numeric IDs without rounding their digits.\n- Locate syntax errors by line and column. YAML also supports multiple documents.\n\nImport, organize, and share\n- Open files from Files, Mail, AirDrop, messaging apps, cloud drives, or other apps. Open/share menu availability depends on iOS and the source app.\n- Select multiple documents or ZIP packages. Update duplicates, keep both copies, or skip individual files, then review import results.\n- Paste HTML, Markdown, JSON, or YAML text to create a local preview.\n- Find saved files by filename, pin frequent documents, and rename display titles.\n- Share original files or complete ZIP packages. Export HTML and Markdown previews as PDF.\n- Try the built-in HTML, Markdown, JSON, YAML, and ZIP samples.\n\nSupported extensions: .html, .htm, .md, .markdown, .json, .yaml, .yml, and .zip. JSON and YAML previews are read-only and share the original file. JSONC comments and trailing commas are not supported. PDF export is available for HTML and Markdown.\n\nPrivacy and purchase\nFiles are processed on device; the app does not upload your files. No account or ads. Paid download with no subscription or in-app purchase.\n\nNew HTML files, including HTML inside ZIP packages, open in Interactive mode with page JavaScript and external resources enabled. The HTML content can make network requests. Select Safe Preview to block page scripts and external HTTP/HTTPS resources. External navigation and form navigation remain blocked in both modes. Saved preview choices are preserved when reopening files."}, "zh-Hans": {"name": "HTML 预览器", "subtitle": "Markdown 阅读、JSON 查看与 ZIP 报告", "keywords": "YAML,MD,文件,打开,查看器,离线,源码,代码,PDF,导出,公式,流程图,Mermaid,LaTeX,配置,README,本地", "promotional_text": "收到 HTML 或 ZIP 报告，随手打开；阅读 Markdown 代码与公式，查看 JSON/YAML 结构。文件在设备本地处理，付费下载，无广告、无订阅。", "description": "在 iPhone 和 iPad 上打开收到的 HTML 与 ZIP 报告、阅读 Markdown 笔记、查看 JSON 和 YAML 配置。文件在设备本地处理。\n\n读内容，也保留排版\n- 呈现 HTML 布局、图形与动画。\n- 阅读 Markdown 表格与高亮代码，一键复制代码内容。\n- 离线显示 Markdown 数学公式和 Mermaid 流程图。\n- 在 ZIP 报告中切换 HTML 与 Markdown 页面，保留本地 CSS 和图片资源。\n- 文内搜索、标题目录、阅读外观调整，再次打开接着读。\n\n看清 JSON 与 YAML 结构\n- 展开嵌套对象和数组，搜索字段和值，核对带行号的高亮源码。\n- 复制值或字段路径，从字段跳到对应源码行。\n- 显示和复制 JSON 大整数 ID 时保留原始数字，不进行舍入。\n- 语法错误定位到具体行列；YAML 支持多个文档切换。\n\n导入、整理与分享\n- 从“文件”、邮件、隔空投送、消息应用、网盘或其他 App 打开文件。打开或分享菜单的可用性取决于 iOS 和来源 App。\n- 一次选择多份文档或 ZIP 报告包。重复文件可更新、保留两份或逐份跳过，完成后查看导入结果。\n- 粘贴 HTML、Markdown、JSON 或 YAML 文本，创建本地预览。\n- 按文件名查找资料，置顶常用文件，修改显示名称。\n- 分享原文件或完整 ZIP 报告包，将 HTML 与 Markdown 预览导出为 PDF。\n- 内置 HTML、Markdown、JSON、YAML 与 ZIP 示例。\n\n支持 .html、.htm、.md、.markdown、.json、.yaml、.yml、.zip。JSON 与 YAML 为只读预览，可分享原文件；JSON 不支持 JSONC 注释和尾随逗号。PDF 导出适用于 HTML 与 Markdown。\n\n隐私与购买方式\n文件在设备本地处理，App 不上传你的文件。无账号、无广告。付费下载，无订阅，无 App 内购买。\n\n新导入的 HTML（包括 ZIP 中的 HTML）默认使用交互模式，允许页面 JavaScript 和外部资源，HTML 内容可以发起网络请求。可切换到安全预览，阻止页面脚本和外部 HTTP/HTTPS 资源。两种模式都会继续阻止外部跳转和表单跳转。再次打开文件时，会保留已保存的预览模式。"}, "ja": {"name": "HTMLプレビュー", "subtitle": "Markdown・JSON・ZIPビューア", "keywords": "YAML,md,ファイル,閲覧,開く,リーダー,オフライン,ソース,コード,PDF,書き出し,数式,図,Mermaid,LaTeX,設定,README,ローカル", "promotional_text": "届いたHTML・ZIPレポートを開く。Markdownのコードや数式を読み、JSON・YAMLの構造を確認。ファイルは端末内で処理します。有料ダウンロード、広告・サブスクリプションなし。", "description": "iPhoneとiPadで、届いたHTML・ZIPレポートを開き、Markdownのノートを読み、JSONやYAMLの設定を確認。ファイルは端末内で処理します。\n\n内容もレイアウトも読みやすく\n- HTMLのレイアウト、グラフィック、アニメーションを表示。\n- Markdownの表と構文ハイライト付きコードを閲覧。コードをワンタップでコピー。\n- Markdownの数式とMermaid図をオフラインで表示。\n- ZIP内のHTML・Markdownページを切り替え。ローカルCSSや画像も利用できます。\n- 文書内検索、見出しの目次、読みやすさの調整、閲覧位置の保存に対応。\n\nJSON・YAMLの構造を確認\n- 入れ子のオブジェクトと配列を展開し、フィールドと値を検索。行番号付きのソースを確認できます。\n- 値やフィールドのパスをコピーし、該当するソース行へ移動。\n- 大きなJSON整数IDも、桁を丸めずに表示・コピー。\n- 構文エラーの行と列を確認。YAMLは複数ドキュメントの切り替えに対応。\n\n取り込み・整理・共有\n- 「ファイル」、メール、AirDrop、メッセージアプリ、クラウドドライブ、その他のアプリからファイルを開けます。「開く」や共有メニューの表示は、iOSと送信元アプリによって異なります。\n- 複数の文書やZIPレポートをまとめて取り込み。重複ファイルは更新・両方保存・スキップを選び、完了後に結果を確認できます。\n- HTML、Markdown、JSON、YAMLのテキストを貼り付けてプレビュー。\n- ファイル名で検索し、よく使う文書を固定。表示名の変更にも対応。\n- 元のファイルやZIPパッケージを共有。HTML・MarkdownのプレビューをPDFに書き出せます。\n- HTML、Markdown、JSON、YAML、ZIPの内蔵サンプルを用意。\n\n対応拡張子：.html、.htm、.md、.markdown、.json、.yaml、.yml、.zip。JSONとYAMLは読み取り専用で、元のファイルを共有できます。JSONCのコメントや末尾のカンマには対応していません。PDFへの書き出しはHTMLとMarkdownで利用できます。\n\nプライバシーと購入方式\nファイルは端末内で処理し、アプリがファイルをアップロードすることはありません。アカウント不要、広告なし。有料ダウンロードで、サブスクリプションやApp内課金はありません。\n\n新しく取り込むHTML（ZIP内のHTMLを含む）は、ページのJavaScriptと外部リソースを許可するインタラクティブモードで開きます。HTMLコンテンツはネットワーク通信を行うことがあります。安全プレビューに切り替えると、ページのスクリプトと外部HTTP/HTTPSリソースをブロックします。どちらのモードでも外部ページへの移動とフォーム送信による移動はブロックします。再度開くときは、保存済みのプレビューモードを維持します。"}, "zh-Hant": {"name": "HTML 預覽器", "subtitle": "Markdown 閱讀、JSON 檢視與 ZIP 報告", "keywords": "YAML,MD,檔案,開啟,檢視器,離線,原始碼,程式碼,PDF,匯出,數學公式,流程圖,Mermaid,LaTeX,設定,README,本機", "promotional_text": "收到 HTML 或 ZIP 報告，隨手開啟；閱讀 Markdown 程式碼與公式，檢視 JSON/YAML 結構。檔案在裝置本機處理，付費下載，無廣告、無訂閱。", "description": "在 iPhone 和 iPad 上開啟收到的 HTML 與 ZIP 報告、閱讀 Markdown 筆記、檢視 JSON 和 YAML 設定。檔案在裝置本機處理。\n\n閱讀內容，也保留排版\n- 呈現 HTML 版面配置、圖形與動畫。\n- 閱讀 Markdown 表格與醒目提示的程式碼，一鍵複製程式碼內容。\n- 離線顯示 Markdown 數學公式和 Mermaid 流程圖。\n- 在 ZIP 報告中切換 HTML 與 Markdown 頁面，保留本機 CSS 和圖片資源。\n- 文內搜尋、標題目錄與閱讀外觀調整，再次開啟接著讀。\n\n看清 JSON 與 YAML 結構\n- 展開巢狀物件和陣列，搜尋欄位與值，核對附行號的原始碼。\n- 複製值或欄位路徑，從欄位跳到對應原始碼行。\n- 顯示和複製 JSON 大整數 ID 時保留原始數字，不進行四捨五入。\n- 語法錯誤定位到具體行與欄；YAML 支援切換多份文件。\n\n匯入、整理與分享\n- 從「檔案」、郵件、AirDrop、訊息 App、雲端硬碟或其他 App 開啟檔案。開啟或分享選單的可用性取決於 iOS 和來源 App。\n- 一次選擇多份文件或 ZIP 報告包。重複檔案可更新、保留兩份或逐份略過，完成後查看匯入結果。\n- 貼上 HTML、Markdown、JSON 或 YAML 文字，建立本機預覽。\n- 依檔名尋找資料，釘選常用檔案，修改顯示名稱。\n- 分享原始檔案或完整 ZIP 報告包，將 HTML 與 Markdown 預覽匯出為 PDF。\n- 內建 HTML、Markdown、JSON、YAML 與 ZIP 範例。\n\n支援 .html、.htm、.md、.markdown、.json、.yaml、.yml、.zip。JSON 與 YAML 為唯讀預覽，可分享原始檔案；JSON 不支援 JSONC 註解和結尾逗號。PDF 匯出適用於 HTML 與 Markdown。\n\n隱私與購買方式\n檔案在裝置本機處理，App 不會上傳你的檔案。無帳號、無廣告。付費下載，無訂閱，無 App 內購買。\n\n新匯入的 HTML（包括 ZIP 中的 HTML）預設使用互動模式，允許頁面 JavaScript 和外部資源，HTML 內容可以發出網路請求。可切換至安全預覽，阻擋頁面指令碼和外部 HTTP/HTTPS 資源。兩種模式都會繼續阻擋外部跳轉和表單跳轉。再次開啟檔案時，會保留已儲存的預覽模式。"}}};const suffixes=["01-html-report", "02-markdown-preview", "03-json-preview", "04-yaml-preview", "05-batch-import", "06-library"];function update(){const locale=document.querySelector('#locale').value;const device=document.querySelector('#device').value;document.querySelector('#grid').innerHTML=suffixes.map(s=>{const src='screenshots/'+locale+'/'+device+'-'+s+'.png';return '<div class="card"><a href="'+src+'" target="_blank"><img alt="'+s+'" src="'+src+'"></a><p>'+s+'</p></div>'}).join('');const fields=listing.locales[locale];document.querySelector('#metadata').textContent=Object.entries(fields).map(([k,v])=>k+'\n'+v).join('\n\n')}document.querySelectorAll('select').forEach(el=>el.addEventListener('change',update));update();</script></body></html>
